org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=false
android.useAndroidX=true
# Keep legacy KGP until camera_android_camerax, flutter_tts, and home_widget migrate to AGP built-in Kotlin.
android.builtInKotlin=false
# Flutter 3.47 uses legacy AGP DSL internals; remove after upgrading Flutter and migrating all Android plugins.
android.newDsl=false
