<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpectruLenPor | Scientific retrieval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --accent:#bf4520; --blue:#2e5aa8; --sans:Geist,system-ui,sans-serif; --serif:"Instrument Serif",Georgia,serif; --mono:"Geist Mono",ui-monospace,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; padding:28px; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    .frame { width:min(100%,1280px); margin:0 auto; }
    .eyebrow { color:var(--muted); font:500 10px var(--mono); letter-spacing:.18em; text-transform:uppercase; margin:0 0 8px; }
    h1 { margin:0 0 20px; font:400 clamp(28px,3vw,38px)/1.05 var(--serif); letter-spacing:-.02em; }
    .canvas { overflow-x:auto; }
    svg { display:block; width:100%; min-width:1020px; height:auto; }
    .note { margin:12px 0 0; color:var(--soft); font:italic 15px var(--serif); }
    @media print { body{padding:0} .canvas{overflow:visible} svg{min-width:0} }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Scientific retrieval · corpus + live references · by Abdou</p>
    <h1>From an object label to traceable scientific context</h1>
    <div class="canvas">
      <svg viewBox="0 0 1300 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rag-title rag-desc">
        <title id="rag-title">SpectruLenPor scientific retrieval flow</title>
        <desc id="rag-desc">An object label is expanded into candidate materials and routed through strict, detailed or semantic retrieval. Local chemistry records and optional live references are combined with cache and CAS provenance checks before a grounded context is sent to OpenRouter. The answer includes citations; lexical source matching is only a relevance hint, not verification.</desc>
        <defs>
          <marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#4f5d75"/></marker>
          <marker id="ar-a" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#bf4520"/></marker>
          <marker id="ar-b" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="1300" height="590" fill="#f5f5f5"/>

        <g fill="none" stroke="#2d3142" stroke-opacity=".13">
          <line x1="224" y1="78" x2="224" y2="510"/>
          <line x1="448" y1="78" x2="448" y2="510"/>
          <line x1="792" y1="78" x2="792" y2="510"/>
          <line x1="1038" y1="78" x2="1038" y2="510"/>
        </g>
        <g fill="#5a6580" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1.4">
          <text x="40" y="54">01 · OBSERVE</text>
          <text x="250" y="54">02 · ROUTE</text>
          <text x="476" y="54">03 · RETRIEVE</text>
          <text x="820" y="54">04 · VALIDATE</text>
          <text x="1064" y="54">05 · SYNTHESIZE</text>
        </g>

        <!-- connectors behind cards -->
        <path d="M204 280 H250" stroke="#4f5d75" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
        <path d="M430 240 H476 V154 H520" stroke="#bf4520" stroke-width="1.3" fill="none" marker-end="url(#ar-a)"/>
        <path d="M430 270 H520" stroke="#2e5aa8" stroke-width="1.3" fill="none" marker-end="url(#ar-b)"/>
        <path d="M430 302 H476 V466 H520" stroke="#4f5d75" stroke-width="1.1" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)"/>
        <path d="M760 154 H816 V226 H842" stroke="#4f5d75" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
        <path d="M760 326 H842" stroke="#2e5aa8" stroke-width="1.3" fill="none" marker-end="url(#ar-b)"/>
        <path d="M760 466 H816 V360 H842" stroke="#4f5d75" stroke-width="1.1" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)"/>
        <path d="M1020 292 H1064" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#ar-a)"/>
        <path d="M1154 360 V416" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

        <!-- node: label -->
        <rect x="40" y="220" width="164" height="120" rx="6" fill="#fff" stroke="#4f5d75"/>
        <text x="56" y="246" fill="#5a6580" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1">INPUT</text>
        <text x="56" y="276" fill="#2d3142" font-family="Geist,sans-serif" font-size="15" font-weight="600">Object / formula</text>
        <text x="56" y="300" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">YOLO class · VLM cues</text>
        <text x="56" y="318" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">User text / follow-up</text>

        <!-- node: retrieval router -->
        <rect x="250" y="198" width="180" height="150" rx="6" fill="#bf4520" fill-opacity=".07" stroke="#bf4520" stroke-width="1.4"/>
        <text x="268" y="224" fill="#bf4520" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1">DOCS SEARCH</text>
        <text x="268" y="252" fill="#2d3142" font-family="Geist,sans-serif" font-size="15" font-weight="600">Retrieval modes</text>
        <rect x="268" y="270" width="144" height="20" rx="3" fill="#fff" stroke="#bf4520" stroke-opacity=".4"/>
        <text x="340" y="284" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="9">STRICT · exact keys</text>
        <rect x="268" y="296" width="144" height="20" rx="3" fill="#fff" stroke="#bf4520" stroke-opacity=".4"/>
        <text x="340" y="310" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="9">DETAILED · properties</text>
        <rect x="268" y="322" width="144" height="20" rx="3" fill="#fff" stroke="#bf4520" stroke-opacity=".4"/>
        <text x="340" y="336" text-anchor="middle" fill="#2d3142" font-family="Geist Mono,monospace" font-size="9">SEMANTIC · materials</text>

        <!-- local corpus -->
        <rect x="520" y="92" width="240" height="124" rx="6" fill="#fff" stroke="#4f5d75"/>
        <text x="540" y="118" fill="#5a6580" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1">LOCAL CORPUS</text>
        <text x="540" y="148" fill="#2d3142" font-family="Geist,sans-serif" font-size="15" font-weight="600">Structured records</text>
        <text x="540" y="170" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10">119 elements · 110 compounds</text>
        <text x="540" y="190" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10">GHS lab-safety data · formulas</text>
        <text x="540" y="206" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">Exact symbols · titles · CAS</text>

        <!-- external sources -->
        <rect x="520" y="264" width="240" height="124" rx="6" fill="#fff" stroke="#2e5aa8"/>
        <text x="540" y="290" fill="#2e5aa8" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1">LIVE REFERENCES</text>
        <text x="540" y="320" fill="#2d3142" font-family="Geist,sans-serif" font-size="15" font-weight="600">External source lookup</text>
        <text x="540" y="342" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10">PubChem · Wikipedia</text>
        <text x="540" y="362" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10">Web search provider</text>
        <text x="540" y="378" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">Used according to selected mode</text>

        <!-- cache -->
        <rect x="520" y="432" width="240" height="68" rx="6" fill="#2d3142" fill-opacity=".035" stroke="#4f5d75" stroke-dasharray="4 3"/>
        <text x="540" y="458" fill="#5a6580" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1">RESPONSE CACHE</text>
        <text x="540" y="484" fill="#2d3142" font-family="Geist,sans-serif" font-size="13" font-weight="600">Namespaced keys · TTL expiry</text>

        <!-- CAS / provenance -->
        <rect x="842" y="208" width="178" height="168" rx="6" fill="#fff" stroke="#4f5d75"/>
        <text x="860" y="234" fill="#5a6580" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1">DATA DISCIPLINE</text>
        <text x="860" y="262" fill="#2d3142" font-family="Geist,sans-serif" font-size="14" font-weight="600">CAS + provenance</text>
        <text x="860" y="288" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10">108 / 110 have CAS</text>
        <text x="860" y="308" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="10">2 mixtures: no single CAS</text>
        <text x="860" y="332" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">Checksum · curated source</text>
        <text x="860" y="352" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">Reject ambiguous matches</text>

        <!-- synthesis -->
        <rect x="1064" y="208" width="196" height="152" rx="6" fill="#bf4520" fill-opacity=".07" stroke="#bf4520" stroke-width="1.4"/>
        <text x="1082" y="234" fill="#bf4520" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1">GROUNDED PROMPT</text>
        <text x="1082" y="262" fill="#2d3142" font-family="Geist,sans-serif" font-size="14" font-weight="600">OpenRouter LLM</text>
        <text x="1082" y="286" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">Structured context</text>
        <text x="1082" y="306" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">Source snippets + IDs</text>
        <text x="1082" y="326" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">Inline citation instruction</text>
        <text x="1082" y="346" fill="#bf4520" font-family="Geist Mono,monospace" font-size="9">Streamed answer · [n]</text>

        <rect x="1064" y="416" width="196" height="100" rx="6" fill="#fff" stroke="#4f5d75"/>
        <text x="1082" y="442" fill="#5a6580" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1">PRESENTATION</text>
        <text x="1082" y="468" fill="#2d3142" font-family="Geist,sans-serif" font-size="13" font-weight="600">Citations + source hints</text>
        <text x="1082" y="488" fill="#4f5d75" font-family="Geist Mono,monospace" font-size="9">Lexical overlap heuristic</text>
        <text x="1082" y="504" fill="#bf4520" font-family="Geist Mono,monospace" font-size="9">Not claim verification</text>

        <text x="40" y="550" fill="#5a6580" font-family="Geist Mono,monospace" font-size="9" letter-spacing="1">LOCAL CORPUS FIRST · EXTERNAL LOOKUPS ARE MODE-DEPENDENT · CAS GAPS ARE EXPLICIT, NEVER GUESSED</text>
      </svg>
    </div>
    <p class="note">A citation points to a source used to build the answer. Candidate source matching is a lexical relevance signal, not proof that a source entails a claim.</p>
  </main>
</body>
</html>
