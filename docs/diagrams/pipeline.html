<!doctype html>

  <style>

    * { box-sizing:border-box; }

    .eyebrow { color:var(--muted); font:500 10px var(--mono); letter-spacing:.18em; text-transform:uppercase; margin:0 0 8px; }
    h1 { margin:0 0 20px; font:400 clamp(28px,3vw,38px)/1.05 var(--serif); letter-spacing:-.02em; }
    .canvas { overflow-x:auto; }
    svg { display:block; width:100%; min-width:1020px; height:auto; }
    .note { margin:12px 0 0; color:var(--soft); font:italic 15px var(--serif); }
    @media print { body{padding:0} .canvas{overflow:visible} svg{min-width:0} }
  </style>
