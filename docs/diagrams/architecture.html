<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpectruLenPor · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    .legend {
      display: flex; gap: 1.75rem; flex-wrap: wrap; margin-top: 1.25rem;
      font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em;
      color: var(--color-muted);
    }
    .legend span { display: inline-flex; align-items: center; gap: 0.45rem; }
    .sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · SpectruLenPor v5.5.1</p>
    <h1>Local-first scientific glasses pipeline</h1>

      <title id="arch-title">SpectruLenPor architecture</title>
      <desc id="arch-desc">Camera or BLE glasses frames pass VisionGate into the on-device YOLO26-Nano detector; the Flutter UI captures and sends frames to Moondream3 and the OpenRouter reasoning chain, which retrieves context from the bundled CAS-annotated corpus and live lookups; answers stream back with citations and Fish Audio TTS, while a 9-table internal database logs the session.</desc>

      </defs>

      <text x="340" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ONNX EP bench · 640 letterbox</text>
