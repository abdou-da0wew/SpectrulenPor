<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpectruLenPor system architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; Diagram Design</p>
    <h1>SpectruLenPor &mdash; from glasses to grounded answer</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
        <title id="arch-title">SpectruLenPor system architecture</title>
        <desc id="arch-desc">System architecture of SpectruLenPor: an ESP32-CAM glasses capture end streams JPEG frames and UV/IR telemetry over BLE to the Flutter phone app, which runs VisionGate and YOLO26-Nano on-device, sends selected crops through the Moondream3 and OpenRouter VLM cascade with SQLite-backed RAG from PubChem and Wikipedia, and speaks the cited answer through Fish Audio TTS.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= ZONES (painted first) ================= -->
        <rect x="40" y="96" width="200" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="96" y="100" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="140" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">GLASSES &middot; CAPTURE</text>

        <rect x="264" y="96" width="392" height="380" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="380" y="100" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PHONE APP &middot; ALL PROCESSING</text>

        <rect x="680" y="96" width="240" height="380" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="744" y="100" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="800" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CLOUD &middot; EXTERNAL</text>

        <!-- ================= ARROWS (before nodes) ================= -->
        <!-- 1. Glasses -> VisionGate : BLE JPEG -->
        <line x1="224" y1="172" x2="288" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="232" y="154" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="163" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BLE JPEG</text>

        <!-- 2. VisionGate -> YOLO26-Nano -->
        <line x1="440" y1="172" x2="464" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3. YOLO26-Nano -> VLM cascade : box crop -->
        <line x1="536" y1="208" x2="536" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="542" y="222" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="564" y="231" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">BOX CROP</text>

        <!-- 4. VLM cascade -> OpenRouter : HTTPS -->
        <path d="M 608,288 H 664 Q 672,288 672,280 V 176 Q 672,168 680,168 H 704" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 5. VLM cascade -> SQLite store : RAG -->
        <line x1="536" y1="344" x2="536" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="542" y="358" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="548" y="367" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">RAG</text>

        <!-- 6. SQLite store -> PubChem/Wikipedia : HTTPS (hops over the speech corridor) -->
        <path d="M 608,420 H 652 Q 660,420 660,412 V 376 a 8,8 0 0,1 0,-16 V 296 a 8,8 0 0,1 0,-16 V 280 Q 660,272 668,272 H 704" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 7. Speech out -> Fish Audio : HTTPS -->
        <path d="M 364,344 V 360 Q 364,368 372,368 H 780 Q 788,368 788,360 V 304" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- ================= NODES ================= -->
        <!-- ESP32-CAM glasses (input) -->
        <rect x="56" y="136" width="168" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="136" width="168" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="64" y="142" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="78" y="151" fill="rgba(90,101,128,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="140" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ESP32-CAM glasses</text>
        <text x="140" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OV2640 &middot; UV/IR &middot; BLE</text>

        <!-- VisionGate (backend) -->
        <rect x="288" y="136" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="136" width="152" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="296" y="142" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="310" y="151" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="364" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">VisionGate</text>
        <text x="364" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">brightness &middot; blur</text>

        <!-- YOLO26-Nano (focal) -->
        <rect x="464" y="136" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="464" y="136" width="144" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="472" y="142" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="486" y="151" fill="rgba(191,69,32,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
        <text x="536" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">YOLO26-Nano</text>
        <text x="536" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">640 letterbox &middot; NMS</text>

        <!-- Speech out (backend) -->
        <rect x="288" y="256" width="152" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="256" width="152" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="296" y="262" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="310" y="271" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TTS</text>
        <text x="364" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Speech out</text>
        <text x="364" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Fish Audio &middot; native</text>

        <!-- VLM cascade (backend) -->
        <rect x="456" y="256" width="152" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="456" y="256" width="152" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="464" y="262" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="478" y="271" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VLM</text>
        <text x="532" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">VLM cascade</text>
        <text x="532" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Moondream3 &rarr; router</text>

        <!-- SQLite WAL store (store) -->
        <rect x="288" y="392" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="392" width="320" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="296" y="398" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="310" y="407" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="448" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SQLite WAL knowledge store</text>
        <text x="448" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">9 tables &middot; TTL cache</text>

        <!-- OpenRouter (external) -->
        <rect x="704" y="136" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="136" width="192" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="712" y="142" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="726" y="151" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="800" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OpenRouter</text>
        <text x="800" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chat &middot; VLM routes</text>

        <!-- PubChem / Wikipedia (external) -->
        <rect x="704" y="240" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="240" width="192" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="712" y="246" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="726" y="255" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="800" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PubChem &middot; Wikipedia</text>
        <text x="800" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RAG &middot; GHS &middot; CAS</text>

        <!-- Fish Audio (external) -->
        <rect x="704" y="336" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="336" width="192" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="712" y="342" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="726" y="351" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="800" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Fish Audio</text>
        <text x="800" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">EN / AR voices</text>

        <!-- ================= LEGEND ================= -->
        <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="552" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="138" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">FOCAL</text>
        <rect x="216" y="552" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="234" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">ON-DEVICE</text>
        <rect x="348" y="552" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="366" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">STORE</text>
        <rect x="448" y="552" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="466" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">EXTERNAL</text>
        <rect x="568" y="552" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="586" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">CAPTURE INPUT</text>
        <line x1="728" y1="554" x2="756" y2="554" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="764" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">HTTPS</text>
      </svg>
    </div>
  </div>
</body>
</html>
