# Flutter l10n configuration — ARB-driven translation framework.
# Source: lib/l10n/app_en.arb (template) + lib/l10n/app_ar.arb (Arabic).
# Run `flutter pub get` to regenerate lib/l10n/app_localizations*.dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n
preferred-supported-locales: [en, ar]
nullable-getter: false            # AppLocalizations.of(ctx).key (no `!` needed)
