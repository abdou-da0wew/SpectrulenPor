name: smart_glass_app
description: >-
  SpectruLenPor (v5.5) is a smart-glasses and Android research project authored
  by Malak Adel Sayed Hassan. Original application and firmware code developed
  by Abdou (عبد الرحمن أيمن محمد). Features local YOLO26-Nano ONNX detection,
  user-triggered Moondream3 cloud analysis, three-mode scientific retrieval,
  OpenRouter responses with inline citations, speech services, and SQLite WAL.
publish_to: 'none'
version: 5.5.1+16

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:        # generated Material RTL strings + ARB-driven app strings
    sdk: flutter
  intl: any                     # pinned by flutter_localizations

  # ---------- Bluetooth (ESP32-CAM frame + UV/IR telemetry stream) ----------
  flutter_blue_plus: ^1.32.12

  # ---------- Phone camera source (high-res native preview + YUV->JPEG isolate) ----------
  camera: ^0.11.0+2

  # ---------- Networking (Moondream3 Cloud, OpenRouter LLM+TTS, PubChem, Wiki, Web) ----------
  http: ^1.2.2
  dio: ^5.7.0

  # ---------- Local offline vision fallbacks (disabled when Cloud-Only toggle is ON) ----------
  google_mlkit_image_labeling: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_object_detection: ^0.17.1
  path_provider: ^2.1.4

  # ---------- Voice input (Android SpeechRecognizer) ----------
  speech_to_text: ^7.5.0

  # ---------- Audio output (Native Android TTS + streamed fish-audio TTS) ----------
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  just_audio: ^0.9.39

  # ---------- State management ----------
  provider: ^6.1.2
  rxdart: ^0.28.0

  # ---------- Permissions ----------
  permission_handler: ^11.3.1

  # ---------- UI & Typography ----------
  flutter_markdown: ^0.7.3+1
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # ---------- Persistence (settings + SQLite WAL channel / file store fallback) ----------
  shared_preferences: ^2.3.2

  # ---------- Image processing (target marker painting + YUV->JPEG) ----------
  image: ^4.2.0
  phosphoricons_flutter: ^1.1.1
  home_widget: ^0.10.0
  flutter_local_notifications: ^23.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true  # Flutter l10n codegen
  assets:
    - assets/models/yolo26n.onnx
    - assets/config/secrets.example.json
    - assets/version.json
    - assets/docs/
    - assets/fonts/
  # Register the bundled TTFs so google_fonts resolves them offline
  # (family names must match the GoogleFonts.* getters used in the app).
  # Without this block the fonts shipped in assets/fonts/ were dead weight.
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Italic.ttf
          style: italic
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: Zain
      fonts:
        - asset: assets/fonts/Zain-Regular.ttf
        - asset: assets/fonts/Zain-Bold.ttf
          weight: 700
        - asset: assets/fonts/Zain-ExtraBold.ttf
          weight: 800
    - family: Jaro
      fonts:
        - asset: assets/fonts/Jaro-Regular.ttf
