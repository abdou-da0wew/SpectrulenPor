name: smart_glass_app
description: SpectruLenPor — Smart glasses for spectrum analysis and detection of chemical elements and compounds. ESP32-CAM glasses / phone camera → Moondream3 cloud vision (local Moondream fallback) → OpenRouter text+reasoning presentation → streamed fish-audio TTS.
publish_to: 'none'
version: 4.0.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:        # generated Material RTL strings + ARB-driven app strings
    sdk: flutter
  intl: any                     # pinned by flutter_localizations

  # ---------- Bluetooth (ESP32-CAM frame stream) ----------
  flutter_blue_plus: ^1.32.12    # BLE connection to ESP32-CAM

  # ---------- Camera fallback (use phone camera for demo / no-glasses dev) ----------
  camera: ^0.11.0+2

  # ---------- Networking (Moondream cloud, OpenRouter text+TTS) ----------
  http: ^1.2.2
  dio: ^5.7.0                    # streaming downloads for TTS audio + SSE

  # ---------- Local on-device vision fallback (offline) ----------
  google_mlkit_image_labeling: ^0.16.1     # ML Kit fast labeling (offline fallback)
  google_mlkit_text_recognition: ^0.17.1  # OCR for signs / bottle labels
  path_provider: ^2.1.4         # where to store downloaded GGUF model

  # ---------- v4.0: Object Detection + Mic (chat session) ----------
  google_mlkit_object_detection: ^0.17.1  # ML Kit Object Detection — bounding boxes + labels (no asset needed)
  speech_to_text: ^7.5.0                   # Android built-in SpeechRecognizer for chat mic input

  # ---------- ONNX Runtime Mobile (optional specialized offline classifier) ----------
  # flutter_onnxruntime disabled — onnxruntime-android AAR has compileSdk=33 metadata conflict with androidx 34+ deps.
  # Vision cascade still uses: Moondream cloud → local Moondream (GGUF) → ML Kit (3 tiers).

  # ---------- Audio output ----------
  flutter_tts: ^4.0.2            # Android native TTS (low latency, offline fallback)
  audioplayers: ^6.0.0           # play TTS bytes (legacy path)
  just_audio: ^0.9.39            # streamed fish-audio TTS playback (StreamAudioSource)

  # ---------- State management ----------
  provider: ^6.1.2               # lightweight ChangeNotifier DI
  rxdart: ^0.28.0                # throttle / debounce frame stream

  # ---------- Permissions ----------
  permission_handler: ^11.3.1

  # ---------- UI helpers ----------
  flutter_markdown: ^0.7.3+1     # render OpenRouter markdown replies
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # ---------- Persistence ----------
  shared_preferences: ^2.3.2     # store API keys + settings

  # ---------- Image decoding ----------
  image: ^4.2.0                  # decode/resize/rotate raw JPEG + YUV frames

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true                  # ARB-driven localizations (l10n.yaml)
  assets:
    - assets/
    - assets/models/
    - assets/config/          # secrets.json (gitignored) + example template
    - assets/fonts/

# Bundled Google Fonts (no runtime download needed — works fully offline).
#   Jaro       -> stylish display / headings (EN)
#   Rubik      -> all other normal text (EN)
#   Space Mono -> long text paragraphs (EN)
#   Zain       -> ALL Arabic text
google_fonts:
  fonts:
    - asset: assets/fonts/Jaro-Regular.ttf
    - asset: assets/fonts/Rubik-Regular.ttf
    - asset: assets/fonts/Rubik-Medium.ttf
    - asset: assets/fonts/Rubik-SemiBold.ttf
    - asset: assets/fonts/Rubik-Bold.ttf
    - asset: assets/fonts/SpaceMono-Regular.ttf
    - asset: assets/fonts/SpaceMono-Bold.ttf
    - asset: assets/fonts/SpaceMono-Italic.ttf
    - asset: assets/fonts/Zain-Regular.ttf
    - asset: assets/fonts/Zain-Bold.ttf
    - asset: assets/fonts/Zain-ExtraBold.ttf
